name: Test
on:
  pull_request:
jobs:
  lint:
    uses: hodfords-solutions/actions/.github/workflows/lint.yaml@main
    with:
      package_manager: pnpm
  test:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
